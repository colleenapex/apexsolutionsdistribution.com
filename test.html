<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Apex Form Test</title>
<style>
  :root{--teal:#00d4d4;--orange:#f97316;--dark:#080808;--card:#1e1e22;--line:#3a3a42}
  *{box-sizing:border-box}
  body{margin:0;background:var(--dark);color:#fff;font-family:Arial,Helvetica,sans-serif;padding:24px 16px}
  .box{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
  h1{font-size:1.3rem;margin:0 0 6px}
  .note{color:#bbb;font-size:.85rem;margin:0 0 18px;line-height:1.5}
  label{display:block;font-size:.85rem;margin:14px 0 6px}
  input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#111;color:#fff;font-size:1rem}
  textarea{min-height:110px}
  button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:8px;background:var(--teal);color:#000;font-weight:700;font-size:1rem;cursor:pointer}
  .tip{font-size:.75rem;color:#999;margin-top:6px}
</style>
</head>
<body>
<div class="box">
  <h1>TEST PAGE &mdash; Apex Solutions Distribution</h1>
  <p class="note">This is a private test of the catalog upload. Fill it out and attach a price list (.xlsx, .csv or .pdf).</p>

  <form action="https://forminit.com/f/hj477j3wjxr" method="POST" enctype="multipart/form-data">
    <label for="fn">First Name *</label>
    <input type="text" id="fn" name="fi-sender-firstName" required/>

    <label for="ln">Last Name *</label>
    <input type="text" id="ln" name="fi-sender-lastName" required/>

    <label for="co">Company / Brand Name *</label>
    <input type="text" id="co" name="fi-sender-company" required/>

    <label for="em">Business Email *</label>
    <input type="email" id="em" name="fi-sender-email" required/>

    <label for="ph">Phone Number</label>
    <input type="tel" id="ph" name="fi-sender-phone"/>

    <label for="it">Inquiry Type *</label>
    <select id="it" name="fi-select-inquiry_type" required>
      <option value="">Select inquiry type&hellip;</option>
      <option>Brand or Distributor Submission</option>
      <option>Wholesale Distribution Inquiry</option>
      <option>Replenishable Goods Partnership</option>
      <option>General Inquiry</option>
    </select>

    <label for="msg">Details / Message *</label>
    <textarea id="msg" name="fi-text-message" required></textarea>

    <label for="cf">Attach Catalog or Price List (Optional)</label>
    <input type="file" id="cf" name="fi-file-catalog" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.png,.jpg,.jpeg"/>
    <div class="tip">PDF, DOC, XLSX, CSV, PNG &mdash; up to 25MB</div>

    <button type="submit">Submit Test</button>
  </form>
</div>
</body>
</html>
