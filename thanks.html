<style>
  :root{--teal:#00d4d4;--orange:#f97316;--dark:#080808;--card:#1e1e22;--line:#3a3a42}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--dark);color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .box{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:44px 32px;text-align:center}
  .logo{display:block;margin:0 auto 14px;height:64px;width:auto}
  .brand{font-weight:800;letter-spacing:.12em;font-size:.85rem;text-transform:uppercase;margin:0 0 4px}
  .brand span{color:var(--teal)}
  .tag{color:#9a9aa4;font-size:.75rem;margin:0 0 30px}
  .check{width:72px;height:72px;border-radius:50%;border:3px solid var(--teal);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
  .check svg{width:36px;height:36px;stroke:var(--teal);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:2rem;margin:0 0 14px}
  p.msg{color:rgba(255,255,255,.88);line-height:1.7;font-size:1rem;margin:0 0 30px}
  a.btn{display:inline-block;background:var(--teal);color:#000;font-weight:700;text-decoration:none;padding:13px 30px;border-radius:8px;font-size:1rem}
  a.btn:hover{background:#2be6e6}
</style>
